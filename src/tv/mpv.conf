# Mini TV: small borderless always-on-top player; the window is ALWAYS exactly the old-TV screen (300x225), widescreen movies get black bars
ontop=no
# the TV is a prop on the desktop: it never takes focus, never raises itself, and has no taskbar button
input-default-bindings=no
input-builtin-bindings=no
show-in-taskbar=no
border=no
keepaspect-window=no
keep-open=no
# the file order comes from the playlist (state\movies_playlist.m3u, a fixed shuffled order built by tv\make_playlist.ps1)
shuffle=no
loop-playlist=inf
# remember exactly where each episode stopped (also written every 10 s by tvstate.lua)
save-position-on-quit=yes
resume-playback=yes
volume=35
hwdec=auto-safe
vo=gpu
osc=no
osd-level=1
title=KAIJU-TV
input-ipc-server=\\.\pipe\kaijutv
# subtitles: load any .srt/.ass next to the video, prefer English, readable at mini-window size
sub-auto=fuzzy
slang=en,eng
sub-visibility=yes
sub-font-size=34
sub-border-size=2.2
sub-pos=96
sub-ass-override=strip

# size is fixed at the TV glass; the window is positioned by toggle_tv.ps1 (never resize to the video)
geometry=300x225
autofit=300x225
auto-window-resize=no
focus-on=never
