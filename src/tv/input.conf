# The TV is a prop on the desktop: MOUSE ONLY (no keyboard shortcuts, so typing in another app can never reach it).
# MBTN_LEFT (pause / hover scrub bar / fullscreen button) and MBTN_RIGHT (leave fullscreen) are handled by scripts\tvhover.lua
Alt+MBTN_LEFT begin-vo-dragging
MBTN_RIGHT ignore
MBTN_MID playlist-next
MBTN_LEFT_DBL ignore
WHEEL_UP add volume 3
WHEEL_DOWN add volume -3
Ctrl+MBTN_LEFT cycle mute
