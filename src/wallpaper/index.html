<script>
// 1970s wood-paneled rec room: paneling, lava lamp, spinning record, sunburst clock, window-blind light, shag carpet.
// Everything is drawn procedurally (no image files) so it fits any screen shape.
const PLAQUE='KAIJU';   // INSTALLER-SET: install.ps1 rewrites this one line with the plaque text
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let vw,vh,dpr,s,st=null,floorY,shelfY,cx,OS=1.5,S0=1;

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

// ---------- static layer (rebuilt only on resize)

// ---------- clickable props (their positions are mirrored by the Rainmeter "Scene" skin: keep both in sync; sizes in room units S0)
function shadowE(g,x,y,w){g.fillStyle='rgba(0,0,0,.38)';g.beginPath();g.ellipse(x,y+2*S0,w*.56,8*S0,0,0,6.283);g.fill();}

  g.fillStyle='rgba(255,220,170,.35)';g.fillRect(x,y,w,2.2*S0);g.fillStyle='rgba(0,0,0,.30)';g.fillRect(x,base-leg-3*S0,w,3*S0);
  g.strokeStyle='rgba(30,14,4,.60)';g.lineWidth=2*S0;g.strokeRect(x+8*S0,y+10*S0,w/2-12*S0,h-leg-20*S0);g.strokeRect(x+w/2+4*S0,y+10*S0,w/2-12*S0,h-leg-20*S0);
  g.strokeStyle='rgba(30,14,4,.30)';g.lineWidth=1*S0;for(let k=1;k<5;k++){const yy=y+10*S0+k*(h-leg-20*S0)/5;g.beginPath();g.moveTo(x+10*S0,yy);g.lineTo(x+w/2-6*S0,yy);g.moveTo(x+w/2+6*S0,yy);g.lineTo(x+w-10*S0,yy);g.stroke();}
  g.fillStyle='#d9b24a';g.fillRect(x+w/2-16*S0,y+h*.34,5*S0,16*S0);g.fillRect(x+w/2+11*S0,y+h*.34,5*S0,16*S0);
  g.fillStyle='rgba(235,220,185,.85)';g.font=`bold ${Math.round(10*S0)}px 'Courier New',monospace`;g.textAlign='center';g.textBaseline='middle';g.fillText('KAIJU',x+w*.25,y+h*.62);g.fillText('KAIJU',x+w*.75,y+h*.62);g.textAlign='start';
}
function propCabinet(g,cx0,base,w,h){
  const x=cx0-w/2,y=base-h;shadowE(g,cx0,base,w);
  g.fillStyle='#3a2110';g.fillRect(x+8*S0,base-10*S0,12*S0,10*S0);g.fillRect(x+w-20*S0,base-10*S0,12*S0,10*S0);
  let lg=g.createLinearGradient(x,0,x+w,0);lg.addColorStop(0,'#8a5630');lg.addColorStop(.5,'#a8693a');lg.addColorStop(1,'#7a4a26');g.fillStyle=lg;rr(g,x,y,w,h-10*S0,4*S0);g.fill();
  g.strokeStyle='#2a160a';g.lineWidth=2*S0;g.stroke();
  const dh=(h-10*S0-18*S0)/3;
  for(let i=0;i<3;i++){const dy=y+6*S0+i*(dh+3*S0);g.fillStyle='#935c33';rr(g,x+7*S0,dy,w-14*S0,dh,3*S0);g.fill();g.strokeStyle='rgba(30,14,4,.8)';g.lineWidth=1.5*S0;g.stroke();
    g.fillStyle='#e6c25a';g.fillRect(cx0-12*S0,dy+dh/2-2*S0,24*S0,4*S0);
    g.fillStyle='rgba(235,220,185,.9)';g.fillRect(cx0-20*S0,dy+4*S0,40*S0,8*S0);g.fillStyle='#4a2810';g.font=`bold ${Math.round(6*S0)}px 'Courier New',monospace`;g.textAlign='center';g.textBaseline='middle';g.fillText(['KAIJU','FILES',''][i]||'',cx0,dy+8*S0);g.textAlign='start';}
}
function buildProps(g){
  const fb=floorY+68*S0;
  propCredenza(g,cx-700*S0,fb,480,110*S0);   // the TV stands at the left of the room (Rainmeter skins TVRemote + Console sit on it)
  propCabinet(g,cx+400*S0,fb,130*S0,120*S0);   // the file cabinet (Rainmeter skin Cabinet)
}

function build(){
  const R=rng(7);
  st=document.createElement('canvas');st.width=Math.ceil(vw*dpr);st.height=Math.ceil(vh*dpr);
  const g=st.getContext('2d');g.scale(dpr,dpr);

    g.fillStyle=gr;g.fillRect(x,0,pw+1,floorY);
    for(let k=0;k<22;k++){ // grain
      const gx=x+R()*pw,amp=(0.8+R()*2.4)*s,fr=.004+R()*.012,ph=R()*6.28,dark=R()<.6;

  g.lineCap='round';for(let i=0;i<cnt;i++){const x=R()*vw,y=floorY+R()*(vh-floorY),a=-1.57+(R()-.5)*1.1,l=(5+R()*7)*s;g.strokeStyle=cols[Math.floor(R()*cols.length)];g.globalAlpha=.55+R()*.4;g.lineWidth=(1+R()*1.2)*s;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  g.globalAlpha=1;lg=g.createLinearGradient(0,floorY,0,vh);lg.addColorStop(0,'rgba(20,6,0,.55)');lg.addColorStop(.35,'rgba(20,6,0,.05)');lg.addColorStop(1,'rgba(20,6,0,.25)');g.fillStyle=lg;g.fillRect(0,floorY,vw,vh-floorY);
  { const s=OS;
  // shelf
  const th=18*s;lg=g.createLinearGradient(0,shelfY,0,shelfY+th);lg.addColorStop(0,'#7a4a24');lg.addColorStop(1,'#33190a');g.fillStyle=lg;g.fillRect(0,shelfY,vw,th);g.fillStyle='rgba(255,210,160,.35)';g.fillRect(0,shelfY,vw,1.6*s);

  for(let i=0;i<9;i++){const w=(13+R()*10)*s,h=(70+R()*45)*s,c=bc[Math.floor(R()*bc.length)];g.fillStyle=c;g.fillRect(x,shelfY-h,w,h);g.fillStyle='rgba(0,0,0,.28)';g.fillRect(x+w-2.5*s,shelfY-h,2.5*s,h);g.fillStyle='rgba(255,240,200,.55)';g.fillRect(x+1.5*s,shelfY-h+10*s,w-3*s,2*s);g.fillRect(x+1.5*s,shelfY-h+16*s,w-3*s,1.2*s);g.fillStyle='rgba(0,0,0,.2)';g.fillRect(x,shelfY-h,w,3*s);x+=w+1.2*s;}
  g.save();g.translate(x+20*s,shelfY);g.rotate(-.16);g.fillStyle='#8c4a1c';g.fillRect(-9*s,-98*s,17*s,98*s);g.fillStyle='#e6d3a3';g.fillRect(-7*s,-88*s,13*s,3*s);g.restore();
  g.fillStyle='#b9a98a';g.fillRect(x+44*s,shelfY-52*s,5*s,52*s);g.fillRect(x+44*s,shelfY-4*s,34*s,4*s);
  // plant: a variegated spider plant in a patterned terracotta pot on a saucer
  { const px=cx+305*S0,pb=shelfY-5*s;
    g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(px+4*s,shelfY+1*s,38*s,5*s,0,0,6.283);g.fill();
    g.fillStyle='#8f4220';rr(g,px-29*s,shelfY-6*s,58*s,6*s,3*s);g.fill();g.fillStyle='rgba(255,200,150,.3)';g.fillRect(px-26*s,shelfY-6*s,52*s,1.2*s);                      // saucer
    let pg=g.createLinearGradient(px-26*s,0,px+26*s,0);pg.addColorStop(0,'#a8481f');pg.addColorStop(.35,'#d0652e');pg.addColorStop(1,'#8a3a18');g.fillStyle=pg;
    g.beginPath();g.moveTo(px-25*s,pb-44*s);g.lineTo(px+25*s,pb-44*s);g.lineTo(px+18*s,pb);g.lineTo(px-18*s,pb);g.closePath();g.fill();                                  // pot body
    g.fillStyle='#e8d3a0';for(let i=0;i<5;i++){const cxp=px-16*s+i*8*s,cyp=pb-22*s;g.beginPath();g.moveTo(cxp,cyp-6*s);g.lineTo(cxp+4*s,cyp);g.lineTo(cxp,cyp+6*s);g.lineTo(cxp-4*s,cyp);g.closePath();g.fill();}   // cream diamonds
    g.fillStyle='rgba(60,24,8,.55)';g.fillRect(px-22*s,pb-31*s,44*s,1.6*s);g.fillRect(px-20*s,pb-13*s,40*s,1.6*s);
    pg=g.createLinearGradient(px-28*s,0,px+28*s,0);pg.addColorStop(0,'#9a4220');pg.addColorStop(.35,'#e07838');pg.addColorStop(1,'#8a3a18');g.fillStyle=pg;rr(g,px-28*s,pb-54*s,56*s,12*s,3*s);g.fill();    // rim
    g.fillStyle='rgba(255,220,170,.35)';g.fillRect(px-26*s,pb-53*s,52*s,1.4*s);g.fillStyle='#2a1608';g.beginPath();g.ellipse(px,pb-53*s,24*s,3.2*s,0,0,6.283);g.fill();                   // soil
    const greens=['#4a7a2a','#6a9a36','#86b445','#5a8a30'];g.lineCap='round';
    for(let i=0;i<20;i++){
      const ang=-Math.PI+.28+i/19*(Math.PI-.56)+(R()-.5)*.1,len=(46+R()*36)*s,dirx=Math.cos(ang),droop=(dirx>0?1:-1)*(.12+R()*.2);
      const P0=[px+(R()-.5)*8*s,pb-53*s],C=[P0[0]+dirx*len*.45,P0[1]+Math.sin(ang)*len*1.3],P1=[P0[0]+dirx*len*1.0+droop*len*.25,P0[1]+Math.sin(ang)*len*.7+len*.38];
      const pts=[];for(let k=0;k<=14;k++){const t=k/14,u=1-t;pts.push([u*u*P0[0]+2*u*t*C[0]+t*t*P1[0],u*u*P0[1]+2*u*t*C[1]+t*t*P1[1]]);}

      for(let k=0;k<=14;k++){const a=pts[Math.max(0,k-1)],b=pts[Math.min(14,k+1)],dx=b[0]-a[0],dy=b[1]-a[1],dl=Math.hypot(dx,dy)||1,nx=-dy/dl,ny=dx/dl,w=wmax*Math.pow(Math.sin(Math.PI*Math.min(.97,(k+.6)/15)),.7);L.push([pts[k][0]+nx*w,pts[k][1]+ny*w]);Rr.push([pts[k][0]-nx*w,pts[k][1]-ny*w]);}
      g.fillStyle=greens[i%4];g.beginPath();g.moveTo(L[0][0],L[0][1]);L.forEach(p=>g.lineTo(p[0],p[1]));for(let k=14;k>=0;k--)g.lineTo(Rr[k][0],Rr[k][1]);g.closePath();g.fill();
      g.strokeStyle='rgba(225,240,160,.55)';g.lineWidth=1.8*s;g.beginPath();g.moveTo(pts[1][0],pts[1][1]);pts.slice(2,13).forEach(p=>g.lineTo(p[0],p[1]));g.stroke();                // pale centre stripe
      g.strokeStyle='rgba(20,50,10,.35)';g.lineWidth=.8*s;g.beginPath();g.moveTo(L[1][0],L[1][1]);L.slice(2,14).forEach(p=>g.lineTo(p[0],p[1]));g.stroke();
    }
  }  // framed rainbow print with a brass dedication plaque
  { const ax=cx-440*S0,ay=vh*.30,aw=164*s,ah=214*s,x0=ax-aw/2,y0=ay-ah/2;
    g.fillStyle='rgba(0,0,0,.38)';rr(g,x0+7*s,y0+9*s,aw,ah,5*s);g.fill();
    let fg=g.createLinearGradient(x0,y0,x0+aw,y0+ah);fg.addColorStop(0,'#8a5630');fg.addColorStop(.5,'#6a3c1c');fg.addColorStop(1,'#42230e');g.fillStyle=fg;rr(g,x0,y0,aw,ah,5*s);g.fill();   // walnut frame

    g.fillStyle='#6b3a1c';g.fillRect(px0,cy+ph*.04,pw,ph*.26);for(let i=0;i<4;i++){g.fillStyle=['#8a5028','#a8662f','#c4431a','#d9741f'][i];g.fillRect(px0,cy+ph*.04+i*ph*.055,pw,ph*.026);}   // stripe ground

// ---------- animated bits
const dust=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*6,vy:(Math.random()-.3)*5,r:.8+Math.random()*1.6,ph:Math.random()*6.28}));

const LAMP_PAL=[   // liquid bottom, liquid top, wax hot, wax cool, wall glow. A full colour wheel in hue order, so the last colour flows back into the first
  [[150,10,6],[240,84,22],[255,226,92],[255,150,36],[255,110,30]],      // classic red / orange
  [[110,50,0],[210,130,10],[255,246,150],[255,206,64],[255,176,34]],     // amber gold
  [[10,72,22],[62,172,52],[236,255,132],[150,232,92],[96,204,72]],       // lime green
  [[6,70,96],[24,168,160],[214,255,150],[120,236,170],[40,206,176]],     // teal
  [[8,22,112],[42,94,232],[176,232,255],[92,172,255],[52,122,242]],      // electric blue
  [[44,8,96],[124,52,204],[232,172,255],[184,112,255],[142,72,232]],     // violet
